<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websites</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
  
</head>

<body>
    <header class="header">
        <a href="#" class="logo"><span>Jorge L Pantaleon Vazquez</span></a>
        <ul class="nav-links">
            <li><a href="index.html" id="nav-about">Home</a></li>
        </ul>
        <div class="header-right">
            <div class="lang-switch">
                <button id="btn-en" class="lang-btn active">EN</button>
                <button id="btn-es" class="lang-btn">ES</button>
            </div>
        </div>
    </header>

    <section id="experience" class="experience">
        <h2 class="section-title" id="exp-title">Websites</h2>
        <div class="experience-info">
            <div class="grid">
                <div class="grid-card">
                    <span id="website-1-title">SB Movers</span>
                    <p id="website-1-desc">IT support for modern site I helped build with HTML, CSS, JavaScript.</p>
                    <div class="btn-group">
                        <a class="btn" href="https://amacodez1109.github.io/SBMoversWeb/" target="_blank">SB Movers</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

     <footer>
        <ul>
            <li><a href="index.html" id="foot-about">Home</a></li>
        </ul>
        <p class="copyright" id="copyright">All Rights Reserved | Jorge L Pantaleon</p>
    </footer>

<script>
const translations = {
    en: {
        "nav-about": "Home",
        "exp-title": "Websites",
        "website-1-title": "SB Movers",
        "website-1-desc": "IT support for modern site I helped build with HTML, CSS, JavaScript.",
        "page-title": "Websites - Jorge L Pantaleon Vazquez",
        "copyright": "All Rights Reserved | Jorge L Pantaleon",
        "foot-about": "Home"
        },
    es: {
        "nav-about": "Inicio",
        "exp-title": "Sitios Web",
        "website-1-title": "SB Movers",
        "website-1-desc": "Soporte técnico para un sitio web moderno en cuya creación colaboré utilizando HTML, CSS y JavaScript.",
        "page-title": "Sitios Web - Jorge L Pantaleon Vazquez",
        "copyright": "Todos los derechos reservados | Jorge L Pantaleon",
        "foot-about": "Inicio"
    } // NO semicolon here
};

function setLanguage(lang) {
    localStorage.setItem('lang', lang);
    document.documentElement.lang = lang;

    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-es').classList.toggle('active', lang === 'es');

    const t = translations[lang];
    for (const id in t) {
        if (id === 'page-title') {
            document.title = t[id];
            continue;
        }
        const el = document.getElementById(id);
        if (el) el.textContent = t[id];
    }
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-en').addEventListener('click', () => setLanguage('en'));
    document.getElementById('btn-es').addEventListener('click', () => setLanguage('es'));

    const savedLang = localStorage.getItem('lang') || 'en';
    setLanguage(savedLang);
});
</script>

</body>
</html>
